name: fopa-sop
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fopa-sop
    ports:
      - "8085:3000"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - network

  db:
    image: postgres:15-alpine
    container_name: fopa-sop-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - network
volumes:
  pgdata:

networks:
  network:
    driver: bridge
