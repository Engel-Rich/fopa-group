name: fopa-sop
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fopa-sop
    ports:
      - "8085:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - fopa-sop-db
    networks:
      - network

  fopa-sop-db:
    image: postgres:16-alpine
    container_name: fopa-sop-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - network
volumes:
  pgdata:

networks:
  network:
    driver: bridge
